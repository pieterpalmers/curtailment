[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-curtailment-daemon"
version = "0.1.0"
description = "Solar curtailment daemon for negative tariff periods"
requires-python = ">=3.10"
dependencies = [
    "pymodbus>=3.10",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
