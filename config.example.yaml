growatt:
  host: 10.0.0.150
  port: 1502

apsystems:
  host: 10.0.0.150
  ecu_port: 1503

evcc:
  base_url: http://10.0.0.150:7070
  ev_loadpoint_id: 1
  default_ev_mode: pv
  injection_tariff_path: /api/tariff/feedin
  consumption_tariff_path: /api/tariff/grid
  tariff_field: value

control:
  period_seconds: 30
  sample_count: 2
  sample_interval_seconds: 1
  grid_sample_interval_seconds: 5

  export_setpoint_watts: -200
  deadband_watts: 100
  step_up_pct: 10
  step_down_pct: 20

  growatt_pinned_threshold_watts_low: 500
  growatt_pinned_threshold_watts_high: 2000
  growatt_export_limit_pct: 3
  start_apsystems_pct: 50
  growatt_mode_change_wait_seconds: 120

tariff:
  enter_threshold: 0
  exit_threshold: 0.005
  deep_negative_threshold: -0.15
  min_dwell_seconds: 600

logging:
  level: INFO
  format: console

web:
  enabled: true
  host: 0.0.0.0
  port: 8080

evcc_bridge:
  enabled: false
  evcc_url: http://evcc.local:7070
  poll_interval_s: 5
  refresh_interval_s: 30
  vpp_timer_min: 2
  charge_rate_pct: 100     # 1..100, % for 30409 in charge mode
  hold_rate_pct: 1         # must be >= 1, 0 does not block discharge
  evcc_dead_after_s: 120
